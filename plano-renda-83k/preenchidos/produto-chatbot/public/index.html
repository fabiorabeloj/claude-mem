<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atendimento — IA real</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0b141a;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:20px}
  .phone{width:100%;max-width:420px;height:86vh;min-height:520px;background:#0b141a;border:1px solid #2a3942;border-radius:22px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .top{background:#202c33;padding:12px 16px;display:flex;align-items:center;gap:12px}
  .avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#25D366,#128C7E);display:flex;align-items:center;justify-content:center;font-size:1.3rem}
  .top .name{color:#e9edef;font-weight:600;font-size:.98rem}
  .top .status{color:#25D366;font-size:.78rem}
  .chat{flex:1;overflow-y:auto;padding:18px 14px}
  .msg{max-width:82%;padding:9px 13px;border-radius:10px;margin-bottom:10px;font-size:.92rem;line-height:1.45;color:#e9edef;white-space:pre-wrap;animation:pop .18s ease}
  .bot{background:#202c33;border-top-left-radius:2px;margin-right:auto}
  .user{background:#005c4b;border-top-right-radius:2px;margin-left:auto}
  .typing{display:inline-flex;gap:4px;padding:12px 14px}
  .typing i{width:7px;height:7px;border-radius:50%;background:#8696a0;animation:blink 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
  @keyframes pop{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
  .inputbar{display:flex;gap:10px;padding:10px 12px;background:#202c33}
  .inputbar input{flex:1;background:#2a3942;border:none;border-radius:999px;padding:11px 18px;color:#e9edef;font-size:.92rem;outline:none}
  .inputbar button{background:#25D366;border:none;width:44px;height:44px;border-radius:50%;font-size:1.1rem;cursor:pointer}
  .inputbar button:disabled{opacity:.5;cursor:default}
</style>
</head>
<body>
  <div class="phone">
    <div class="top">
      <div class="avatar">🤖</div>
      <div>
        <div class="name">Facility SaaS · Automação com IA</div>
        <div class="status">online · você está falando com o produto 😉</div>
      </div>
    </div>
    <div class="chat" id="chat"></div>
    <div class="inputbar">
      <input id="inp" placeholder="Digite uma mensagem…" onkeydown="if(event.key==='Enter')send()">
      <button id="btn" onclick="send()">➤</button>
    </div>
  </div>

<script>
const chat = document.getElementById('chat');
const inp = document.getElementById('inp');
const btn = document.getElementById('btn');
const sessionId = crypto.randomUUID();

function add(text, who){
  const m = document.createElement('div');
  m.className = 'msg ' + who;
  m.textContent = text;
  chat.appendChild(m);
  chat.scrollTop = chat.scrollHeight;
  return m;
}

async function send(){
  const text = inp.value.trim();
  if (!text || btn.disabled) return;
  inp.value = '';
  add(text, 'user');
  btn.disabled = true;

  const typing = document.createElement('div');
  typing.className = 'msg bot typing';
  typing.innerHTML = '<i></i><i></i><i></i>';
  chat.appendChild(typing);
  chat.scrollTop = chat.scrollHeight;

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ sessionId, message: text }),
    });
    const data = await res.json();
    typing.remove();
    add(data.reply || data.error || 'Erro inesperado.', 'bot');
  } catch (e) {
    typing.remove();
    add('Sem conexão com o servidor. Ele está rodando?', 'bot');
  } finally {
    btn.disabled = false;
    inp.focus();
  }
}

add('Olá! 😊 Sou o assistente de IA da Facility SaaS — e também sou uma amostra do que a gente constrói. Posso explicar serviços, preços e prazos, ou agendar uma conversa gratuita de 15 min. O que sua empresa mais perde tempo fazendo manualmente?', 'bot');
</script>
</body>
</html>
